<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <meta name="description" content="YorpHives Headquarters — six clear pages for founder oversight.">
  <title>YorpHives HQ — Clean Workspace</title>
  <link rel="stylesheet" href="./styles.css">
  
</head>
<body>
<svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="ic-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/></symbol>
  <symbol id="ic-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></symbol>
  <symbol id="ic-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2H3ZM17 5a3 3 0 0 1 0 6M19 20h2v-2a6 6 0 0 0-4-5.66"/></symbol>
  <symbol id="ic-check" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8 12 2.5 2.5L16 9"/></symbol>
  <symbol id="ic-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 15l4-4 3 2 5-7"/></symbol>
  <symbol id="ic-shield" viewBox="0 0 24 24"><path d="m12 2 8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
  <symbol id="ic-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 8-3 7-3 9h18c0-2-3-1-3-9ZM10 21h4"/></symbol>
  <symbol id="ic-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
  <symbol id="ic-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="ic-back" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
  <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="ic-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
  <symbol id="ic-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4"/></symbol>
  <symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M21 11a9 9 0 0 0-15-6L3 8M3 3v5h5M3 13a9 9 0 0 0 15 6l3-3m0 5v-5h-5"/></symbol>
  <symbol id="ic-spark" viewBox="0 0 24 24"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></symbol>
  <symbol id="ic-link" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7.1 0l2-2A5 5 0 0 0 12 5l-1 1M14 10a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 19l1-1"/></symbol>
  <symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="ic-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
  <symbol id="ic-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  <symbol id="ic-external" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-9 9"/><path d="M19 14v5H5V5h5"/></symbol>
  <symbol id="ic-file" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM15 3v5h5M8 13h8M8 17h8"/></symbol>
  <symbol id="ic-filter" viewBox="0 0 24 24"><path d="M3 5h18M6 12h12m-9 7h6"/></symbol>
</svg>
<a class="skip-link" href="#content">Skip to content</a>
<div class="app-shell" id="app-shell">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand-wrap"><a class="brand" href="#home" aria-label="YorpHives Headquarters home"><span class="brand-symbol">Y<span>H</span></span><span class="brand-text"><strong>YorpHives</strong><small>HEADQUARTERS</small></span></a><span class="brand-tag">FOUNDER SPACE</span></div>
    <nav class="desktop-nav" id="desktop-nav" aria-label="Headquarters pages">
      <button class="nav-btn active" type="button" data-page="home" aria-current="page"><svg class="icon"><use href="#ic-home"/></svg><span>Home</span></button>
      <button class="nav-btn" type="button" data-page="discover"><svg class="icon"><use href="#ic-compass"/></svg><span>Discover</span></button>
      <button class="nav-btn" type="button" data-page="team"><svg class="icon"><use href="#ic-users"/></svg><span>AI Employees</span></button>
      <button class="nav-btn" type="button" data-page="decisions"><svg class="icon"><use href="#ic-check"/></svg><span>Decisions</span><span class="nav-badge" id="decision-count" hidden></span></button>
      <div class="nav-separator" aria-hidden="true"></div>
      <button class="nav-btn" type="button" data-page="growth"><svg class="icon"><use href="#ic-chart"/></svg><span>Growth</span></button>
      <button class="nav-btn" type="button" data-page="control"><svg class="icon"><use href="#ic-shield"/></svg><span>HQ Control</span></button>
    </nav>
    <div class="sidebar-bottom"><div class="founder-badge"><span class="founder-avatar">F</span><span><strong>Founder</strong><small>Read-only HQ</small></span></div></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="topbar-left"><button id="back-button" class="icon-btn back-button" aria-label="Go to previous Headquarters page" title="Go back" hidden><svg class="icon"><use href="#ic-back"/></svg></button><span class="topbar-title">HQ <span class="crumb-arrow">/</span> <strong id="current-page-label">Home</strong></span></div><div class="topbar-actions"><button id="global-search-button" class="search-trigger" aria-label="Search Headquarters"><svg class="icon"><use href="#ic-search"/></svg><span>Search</span><kbd>/</kbd></button><button id="refresh-button" class="icon-btn" title="Refresh evidence" aria-label="Refresh evidence"><svg class="icon"><use href="#ic-refresh"/></svg></button><span class="topbar-avatar" title="Founder only">F</span></div></header>
    <div class="mobile-top"><button id="mobile-back-button" class="icon-btn mobile-back" aria-label="Go back within Headquarters" hidden><svg class="icon"><use href="#ic-back"/></svg></button><span class="mobile-wordmark">YorpHives <strong>HQ</strong></span><span class="mobile-top-actions"><button id="mobile-search-button" class="icon-btn" aria-label="Search"><svg class="icon"><use href="#ic-search"/></svg></button><button id="mobile-refresh-button" class="icon-btn" aria-label="Refresh evidence"><svg class="icon"><use href="#ic-refresh"/></svg></button><span class="topbar-avatar">F</span></span></div>
    <main id="content" tabindex="-1"><div id="page-root" aria-live="polite"></div></main>
  </div>
  <nav class="bottom-nav" aria-label="Mobile navigation"><button data-page="home" class="bottom-item active" aria-current="page"><svg class="icon"><use href="#ic-home"/></svg><span>Home</span></button><button data-page="discover" class="bottom-item"><svg class="icon"><use href="#ic-compass"/></svg><span>Discover</span></button><button data-page="team" class="bottom-item"><svg class="icon"><use href="#ic-users"/></svg><span>Team</span></button><button data-page="decisions" class="bottom-item"><svg class="icon"><use href="#ic-check"/></svg><span>Decisions</span></button><button id="more-button" class="bottom-item" aria-expanded="false" aria-controls="more-popover"><svg class="icon"><use href="#ic-menu"/></svg><span>More</span></button></nav>
</div>
<div id="more-popover" class="more-popover" aria-label="More pages" hidden><div class="popover-title">More</div><button type="button" data-page="growth"><svg class="icon"><use href="#ic-chart"/></svg> Growth <svg class="icon right"><use href="#ic-chevron"/></svg></button><button type="button" data-page="control"><svg class="icon"><use href="#ic-shield"/></svg> HQ Control <svg class="icon right"><use href="#ic-chevron"/></svg></button><button type="button" id="import-menu-action"><svg class="icon"><use href="#ic-upload"/></svg> Open a report <svg class="icon right"><use href="#ic-chevron"/></svg></button></div>
<div id="detail-scrim" class="detail-scrim" hidden></div><aside class="detail-drawer" id="detail-drawer" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden><div class="drawer-header"><span class="pill neutral">DETAILS</span><button class="icon-btn" id="detail-close" aria-label="Close detail"><svg class="icon"><use href="#ic-close"/></svg></button></div><div id="detail-content"></div></aside>
<dialog id="search-modal" class="search-modal" aria-label="Search Headquarters"><div class="search-modal-top"><svg class="icon"><use href="#ic-search"/></svg><input id="search-input" type="search" placeholder="Search pages and records" autocomplete="off" aria-label="Search HQ pages and evidence"><button id="search-close" class="icon-btn" aria-label="Close search"><svg class="icon"><use href="#ic-close"/></svg></button></div><div id="search-results" class="search-results"></div><div class="search-footer">Pages and loaded records.</div></dialog>
<dialog id="copy-modal" class="copy-modal" aria-labelledby="copy-heading"><h2 id="copy-heading">Copy status</h2><textarea id="copy-text" readonly aria-label="Status text"></textarea><button id="copy-close" type="button" class="button button-primary">Close</button></dialog>
<input id="report-file" type="file" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script defer src="./dashboard.js"></script>
</body>
</html>
