# Deploy from this control-system directory. No changes to existing HQ or site deployments.
name = "yorphives-hq-control-preview"
main = "index.js"
compatibility_date = "2026-11-17"

[triggers]
crons = ["0 */6 * * *"]

[[kv_namespaces]]
binding = "CONTROL_KV"
id = "68841a27b07c4ff2b8e4c3822556dc46"

[vars]
TARGET_URL = "https://yorphives.com"

# CONTROL_TOKEN must be configured as a secret in Cloudflare.
# Never commit an access key.
