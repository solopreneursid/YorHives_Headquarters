const pages=[{id:'home',name:'Home',icon:'home'},{id:'discover',name:'Discover',icon:'compass'},{id:'team',name:'AI Team',icon:'team'},{id:'decisions',name:'Decisions',icon:'check'},{id:'growth',name:'Growth',icon:'chart'},{id:'control',name:'Control',icon:'shield'}];
const categories=['All','Apps & Tools','Technology','Markets','Competitors','Revenue'];
const roles=[['Engineering & Operations','Website and HQ health','shield'],['Research & Innovation','Products, tools and technology','spark'],['Global Market Intelligence','Customer needs and markets','globe'],['Competitive Intelligence','Alternatives and differentiation','compass'],['Product & Growth','Ideas and user growth','chart'],['Revenue & Business','Business models and revenue','bolt']];
let data=null,apiError='',category='All',search='',savedOnly=false,sort='recent',moreOpen=false,detailId=null,loadingScan=false,previousFocus=null;
function route(){const name=location.hash.replace(/^#\/?/,'');return pages.some(p=>p.id===name)?name:'home';}
function navigate(id){if(!pages.some(p=>p.id===id))return;moreOpen=false;if(route()===id){render();return;}location.hash='#/'+id;}
function btnNav(p,mobile=false){const active=route()===p.id;return `<button type="button" class="${mobile?'mobile-link':'navlink'} ${active?'active':''}" data-nav="${p.id}" ${active?'aria-current="page"':''}>${I(p.icon,mobile?21:18)}<span>${esc(p.name)}</span></button>`;}
function renderNav(){document.getElementById('sidebar-nav').innerHTML=pages.slice(0,4).map(p=>btnNav(p)).join('');document.getElementById('sidebar-more').innerHTML=pages.slice(4).map(p=>btnNav(p)).join('');document.getElementById('mobile-nav').innerHTML=[...pages.slice(0,4).map(p=>btnNav(p,true)),`<button class="mobile-link ${['growth','control'].includes(route())?'active':''}" id="more-btn" aria-expanded="${moreOpen}" aria-label="More pages">${I('more',21)}<span>More</span></button>`].join('');document.getElementById('mobile-more').innerHTML=pages.slice(4).map(p=>btnNav(p)).join('');document.getElementById('mobile-more').classList.toggle('show',moreOpen);document.getElementById('top-title').textContent=pages.find(p=>p.id===route()).name;}
const heading=(label,title,right='')=>`<div class="pagehead"><div>${label?`<span class="tiny-tag">${esc(label)}</span>`:''}<h1>${esc(title)}</h1></div>${right}</div>`;
const section=(name,right='')=>`<div class="section-title"><h2>${esc(name)}</h2>${right}</div>`;
const savedIds=()=>new Set(data?.saved||[]);
const decisionsMap=()=>new Map((data?.decisions||[]).map(x=>[x.opportunity_id,x]));
const badge=(label,tone='')=>`<span class="badge ${tone}">${esc(label)}</span>`;
const when=(timestamp)=>{if(!timestamp)return 'Not checked';const date=new Date(timestamp);return Number.isFinite(date.valueOf())?date.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'Unknown';};
const stale=(date,maxMs=60*60*1000)=>!date||Date.now()-Date.parse(date)>maxMs;
function statusText(obj,checked,maxMs=60*60*1000){if(!obj||obj.state==='not-connected')return ['Not connected','amber'];if(obj.state==='ready'||obj.state==='standby')return ['On demand','green'];if(obj.state==='unknown')return ['Unknown','amber'];if(stale(checked||obj.checkedAt,maxMs))return ['Stale','amber'];if(obj.state==='stale')return ['Stale','amber'];return obj.state==='online'?['Online','green']:['Issue','amber'];}
function statusCard(label,icon,obj,checked){const [text,tone]=statusText(obj,checked);return `<article class="panel status-panel"><div class="state-top"><span class="status-name">${I(icon,18)}<strong>${esc(label)}</strong></span>${badge(text,tone)}</div><small class="quiet">${esc(when(checked||obj?.checkedAt))}</small></article>`;}
const info=(message)=>`<div class="note-panel">${I('info',15)} ${esc(message)}</div>`;
function home(){const healthIssues=[];if(!data?.site?.state||data.site.state==='unknown')healthIssues.push('Website check pending');else if(data.site.state==='error')healthIssues.push('Website issue');if(!data?.hq?.state||data.hq.state==='unknown')healthIssues.push('HQ heartbeat pending');else if(data.hq.state==='stale')healthIssues.push('HQ heartbeat stale');if(!data?.watchdog?.checkedAt)healthIssues.push('Watchdog check pending');else if(data.watchdog.state!=='online')healthIssues.push('Watchdog alert');if((data?.scan?.failedSources||[]).length)healthIssues.push('Research source error');const awaiting=(data?.saved||[]).filter(id=>!(data?.decisions||[]).some(x=>x.opportunity_id===id)).length;return `${heading('','Home')}${apiError?info(apiError):''}${section('Health')}<div class="status-grid">${statusCard('YorpHives.com','globe',data?.site,data?.siteUpdatedAt)}${statusCard('YorpHivesHQ','grid',data?.hq,data?.hq?.checkedAt)}${statusCard('YorpMind','spark',data?.mind)}</div>${section('At a glance',`<button class="button linklike" data-nav="control">Control ${I('arrow',15)}</button>`)}<div class="panel panelpad compact-list"><div class="list-row"><span class="numdot">${healthIssues.length||'✓'}</span><div><strong>${healthIssues.length?'Needs attention':'No reported incidents'}</strong><p>${esc(healthIssues.join(' · ')||'Based on latest available checks')}</p></div>${badge(healthIssues.length?'Check':'Clear',healthIssues.length?'amber':'green')}</div><div class="list-row"><span class="numdot">${data?.opportunities?.length||0}</span><div><strong>Research leads</strong><p>${esc(data?.scan?.completed?`Updated ${when(data.scan.completed)}`:'Awaiting first scan')}</p></div><button class="button small" data-nav="discover">Open</button></div><div class="list-row"><span class="numdot">${awaiting}</span><div><strong>For review</strong><p>${savedIds().size} saved leads</p></div><button class="button small" data-nav="decisions">Review</button></div></div>${section('New discoveries',`<button class="button linklike" data-nav="discover">All ${I('arrow',15)}</button>`)}<div class="opportunity-grid">${(data?.opportunities||[]).slice(0,3).map(ideaCard).join('')||'<div class="panel panelpad empty">No leads yet. Open Discover to scan.</div>'}</div>`;}
const sourceHref=(url)=>{try{const u=new URL(url);return u.protocol==='https:'?esc(u.href):'#';}catch{return '#';}};
function ideaCard(x){const saved=savedIds().has(x.id),review=(data?.evaluations||[]).find(e=>e.opportunity_id===x.id);return `<article class="panel idea"><div class="flex">${badge(x.category,'blue')}${review?badge('AI reviewed','green'):''}<span class="spacer"></span><button class="save ${saved?'saved':''}" data-save="${esc(x.id)}" aria-pressed="${saved}" aria-label="${saved?'Unsave':'Save'} ${esc(x.title)}">${I('bookmark',16)}</button></div><strong>${esc(x.title)}</strong><p>${esc(x.summary)}</p><div class="foot"><span class="source">${esc(x.source)} · Unverified</span><button class="button linklike" data-detail="${esc(x.id)}">Details ${I('arrow',15)}</button></div></article>`;}
function filtered(){let list=[...(data?.opportunities||[])].filter(x=>(category==='All'||x.category===category)&&(!savedOnly||savedIds().has(x.id))&&(`${x.title} ${x.summary} ${x.source}`.toLowerCase().includes(search.toLowerCase())));const weights=new Map((data?.learning||[]).map(x=>[x.source,x.weight]));if(sort==='az')list.sort((a,b)=>a.title.localeCompare(b.title));else if(sort==='za')list.sort((a,b)=>b.title.localeCompare(a.title));else if(sort==='useful')list.sort((a,b)=>(weights.get(b.source)||1)-(weights.get(a.source)||1)||Date.parse(b.last_seen)-Date.parse(a.last_seen));return list;}
const results=()=>filtered().map(ideaCard).join('')||'<div class="panel panelpad empty">No matches. Change filters or scan.</div>';
function discover(){return `${heading('Research','Discover',`<button class="button soft" id="run-scan" ${loadingScan?'disabled':''}>${I('refresh',15)} ${loadingScan?'Scanning…':'Scan'}</button>`)}${apiError?info(apiError):''}${data?.scan?.failedSources?.length?info(`Unavailable: ${data.scan.failedSources.join(', ')}`):''}<div class="scrolltabs" aria-label="Opportunity categories">${categories.map(x=>`<button class="filter ${category===x?'active':''}" data-cat="${esc(x)}" aria-pressed="${category===x}">${esc(x)}</button>`).join('')}</div><div class="feed-tools"><label class="feed-search">${I('search',17)}<input id="idea-search" type="search" aria-label="Search opportunities" placeholder="Search" value="${esc(search)}"></label><select class="feed-select" id="idea-sort" aria-label="Sort opportunities"><option value="recent" ${sort==='recent'?'selected':''}>Newest</option><option value="useful" ${sort==='useful'?'selected':''}>Useful</option><option value="az" ${sort==='az'?'selected':''}>A–Z</option><option value="za" ${sort==='za'?'selected':''}>Z–A</option></select><button class="button ${savedOnly?'soft':''}" id="saved-filter" aria-pressed="${savedOnly}">${I('bookmark',15)} Saved</button></div>${data?.scan?.completed?`<p class="quiet">Updated ${esc(when(data.scan.completed))} · ${esc(data.scan.count)} found · Unverified leads</p>`:''}<div class="opportunity-grid" id="idea-results">${results()}</div>${section('Explore sources')}<div class="panel panelpad"><div class="flex wrap" style="gap:8px"><a class="button small" href="https://github.com/explore" target="_blank" rel="noopener noreferrer">GitHub ${I('external',13)}</a><a class="button small" href="https://news.ycombinator.com/show" target="_blank" rel="noopener noreferrer">Hacker News ${I('external',13)}</a><a class="button small" href="https://dev.to" target="_blank" rel="noopener noreferrer">DEV ${I('external',13)}</a><a class="button small" href="https://betalist.com" target="_blank" rel="noopener noreferrer">BetaList ${I('external',13)}</a><a class="button small" href="https://www.producthunt.com" target="_blank" rel="noopener noreferrer">Product Hunt ${I('external',13)}</a></div><p class="quiet">5 public feeds automated · Directories are links only</p></div>`;}
function team(){const connected=!!data?.budget?.aiEnabled,wasTested=data?.mind?.state==='standby';return `${heading('AI workforce','AI Team')}<section class="panel ceo-card" style="padding:20px"><div class="icon-box">${I('spark',24)}</div><div><span class="tiny-tag">AI CEO</span><h2>YorpMind</h2><p>${esc(data?.mind?.detail||'Loading')}</p>${badge(connected?(wasTested?'AI verified':'AI available · untested'):'Rules only',connected?'green':'amber')}</div></section>${section('Workflows')}<div class="worker-grid">${roles.map(([name,desc,icon])=>`<article class="panel worker"><div class="icon-box">${I(icon,19)}</div><h3>${esc(name)}</h3><p>${esc(desc)}</p><div class="meta">${connected?'Rules + shared AI':'Rules + D1 memory'} · Read-only</div></article>`).join('')}</div>${section('Learning')}<section class="panel panelpad"><div class="control-row"><strong>Sources ranked from decisions</strong>${badge(`${(data?.learning||[]).length} sources`,'green')}</div><div class="control-row"><strong>AI-reviewed leads</strong>${badge((data?.evaluations||[]).length)}</div><div class="control-row"><strong>Executable updates</strong>${badge('Founder only')}</div></section>`;}
function decisions(){const bookmarked=(data?.opportunities||[]).filter(x=>savedIds().has(x.id));const decided=decisionsMap();return `${heading('Founder review','Decisions')}<p class="quiet">Records only · No deployment actions</p><div class="decision-list">${bookmarked.map(x=>`<article class="panel decision-card"><div class="flex wrap">${badge(x.category,'blue')}${badge(decided.get(x.id)?.action||'To review')}</div><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><div class="decision-actions"><button class="button primary" data-decision="approve" data-id="${x.id}">Approve</button><button class="button" data-decision="reject" data-id="${x.id}">Reject</button><button class="button" data-decision="snooze" data-id="${x.id}">Snooze</button><button class="button linklike" data-detail="${x.id}">Evidence ${I('arrow',15)}</button></div></article>`).join('')||'<div class="panel panelpad empty">Save an opportunity in Discover to review it here.</div>'}</div>`;}
function growth(){const decided=decisionsMap();const approved=[...decided.values()].filter(x=>x.action==='approve').length;return `${heading('Business','Growth')}<div class="pipeline"><div class="panel"><span class="tiny-tag">Discovered</span><strong>${data?.opportunities?.length||0} leads</strong></div><div class="panel"><span class="tiny-tag">Shortlisted</span><strong>${savedIds().size} saved</strong></div><div class="panel"><span class="tiny-tag">Founder approved</span><strong>${approved}</strong></div><div class="panel"><span class="tiny-tag">AI reviewed</span><strong>${(data?.evaluations||[]).length}</strong></div></div>${section('Verified business metrics')}<section class="panel panelpad"><div class="control-row"><strong>Users</strong>${badge('Not connected')}</div><div class="control-row"><strong>Conversions</strong>${badge('Not connected')}</div><div class="control-row"><strong>Revenue</strong>${badge('Not connected')}</div></section>${section('Source learning')}<section class="panel panelpad">${(data?.learning||[]).length?(data.learning.slice(0,8).map(x=>`<div class="control-row"><div><strong>${esc(x.source)}</strong><small>${x.positive} approved · ${x.negative} rejected</small></div>${badge(x.weight===1?'Baseline':x.weight>1?'Prioritised':'Reduced',x.weight>=1?'green':'amber')}</div>`).join('')):'<p class="quiet">Learning starts after you approve or reject a lead.</p>'}</section>`;}
function control(){const [siteLabel,siteTone]=statusText(data?.site,data?.siteUpdatedAt);const [hqLabel,hqTone]=statusText(data?.hq,data?.hq?.checkedAt);const wd=data?.watchdog||{state:'unknown'};const [wdLabel,wdTone]=statusText(wd,data?.watchdogUpdatedAt,90*60*1000);const budget=data?.budget||{};return `${heading('Operations','Control',`<button class="button soft" id="export-data">${I('external',15)} Export</button>`)}<div class="control-grid"><section class="panel panelpad"><h3>Watchtower</h3><div class="control-row"><div><strong>YorpHives.com</strong><small>${esc(when(data?.site?.checkedAt))}${data?.site?.code?' · HTTP '+esc(data.site.code):''}</small></div>${badge(siteLabel,siteTone)}</div><div class="control-row"><div><strong>YorpHivesHQ heartbeat</strong><small>${esc(when(data?.hq?.checkedAt))}</small></div>${badge(hqLabel,hqTone)}</div><div class="control-row"><div><strong>Independent Watchdog</strong><small>${esc(when(wd.checkedAt))}</small></div>${badge(wdLabel,wdTone)}</div></section><section class="panel panelpad"><h3>Free-tier limits</h3><div class="control-row"><strong>Hosting</strong>${badge('Cloudflare Free','green')}</div><div class="control-row"><strong>AI calls today</strong>${badge(`${budget.aiUsed||0} / ${budget.aiLimit||3}`,budget.aiUsed>=budget.aiLimit?'amber':'green')}</div><div class="control-row"><strong>Scans today</strong>${badge(`${budget.scansUsed||0} / ${budget.scansLimit||8}`)}</div><div class="control-row"><strong>Paid APIs</strong>${badge('None')}</div><div class="control-row"><strong>AI model</strong>${badge(budget.aiEnabled?'Bound':'Offline',budget.aiEnabled?'green':'amber')}</div></section></div>${section('Research sources')}<section class="panel panelpad">${(data?.sources||[]).length?data.sources.map(x=>`<div class="control-row"><div><strong>${esc(x.source)}</strong><small>Success ${x.successes} · Failed ${x.failures}</small></div>${badge(x.last_success?'Connected':'Unverified',x.last_success?'green':'amber')}</div>`).join(''):'<p class="quiet">No completed source checks yet.</p>'}</section>${section('Available upgrades')}<section class="panel panelpad">${(data?.updateCandidates||[]).length?data.updateCandidates.map(x=>`<div class="control-row"><div><strong>${esc(x.repo)}</strong><small>${esc(x.tag)} · ${esc(when(x.detected_at))}</small></div><a class="button small" href="${sourceHref(x.url)}" target="_blank" rel="noopener noreferrer">Review ${I('external',13)}</a></div>`).join(''):'<p class="quiet">Checked weekly. No update candidates yet.</p>'}<p class="quiet">No automatic software installations.</p></section>`;}
const views={home,discover,team,decisions,growth,control};
function render(){renderNav();document.getElementById('page').innerHTML=views[route()]();document.title=`${pages.find(p=>p.id===route()).name} · YorpHivesHQ`;document.body.dataset.page=route();}
function toast(message){const x=document.getElementById('toast');x.textContent=message;x.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove('show'),2800);}
function closeDetail(){document.getElementById('overlay').classList.remove('on');detailId=null;previousFocus?.focus?.();}
function openDetail(id){const x=(data?.opportunities||[]).find(x=>x.id===id);if(!x)return;detailId=id;previousFocus=document.activeElement;const review=(data?.evaluations||[]).find(e=>e.opportunity_id===id);const budget=data?.budget||{};document.getElementById('drawer').innerHTML=`<div class="head">${badge(x.category,'blue')}<button class="icon-btn" id="close-drawer" aria-label="Close details">${I('close')}</button></div><h2 id="drawer-title">${esc(x.title)}</h2><p>${esc(x.summary)}</p><div class="field"><b>Source</b><span>${esc(x.source)}</span></div><div class="field"><b>Evidence</b><span>Public listing · Unverified</span></div><div class="field"><b>Published</b><span>${esc(when(x.source_date))}</span></div>${review?`<div class="field"><b>YorpMind · ${review.fit_score}/5</b><span>${esc(review.reason)}</span></div><div class="field"><b>Risk</b><span>${esc(review.risk)}</span></div><div class="field"><b>Next</b><span>${esc(review.next_step)}</span></div><small class="quiet">AI interpretation · Not independently verified</small>`:'<div class="field"><b>Next</b><span>Verify demand, cost, competition and licensing.</span></div>'}<a href="${sourceHref(x.url)}" target="_blank" rel="noopener noreferrer" class="button soft" style="width:100%;margin-top:16px">Open source ${I('external',15)}</a>${!review?`<button class="button soft" data-evaluate="${esc(x.id)}" ${budget.aiEnabled?'':'disabled'} style="width:100%;margin-top:9px">${I('spark',15)} ${budget.aiEnabled?'Review with YorpMind':'AI unavailable'}</button>`:''}<button class="button primary" data-save="${esc(x.id)}" style="width:100%;margin-top:9px">${I('bookmark',15)} ${savedIds().has(x.id)?'Unsave':'Save'}</button>`;document.getElementById('overlay').classList.add('on');document.getElementById('close-drawer').focus();}
async function callApi(path,method='GET',body){const r=await fetch(path,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin',cache:'no-store'});if(!r.ok){let error;try{error=(await r.json()).error;}catch{}throw Error(error||`Request failed (${r.status})`);}return r.json();}
async function reload(){try{data=await callApi('/api/bootstrap');apiError='';document.querySelector('.demo-chip').textContent='Live';}catch(e){apiError='Data unavailable. Reload to retry.';document.querySelector('.demo-chip').textContent='Offline';}render();}
async function scan(){if(loadingScan)return;loadingScan=true;render();try{await callApi('/api/scan','POST');toast('Scan completed');await reload();}catch(e){toast(e.message||'Scan unavailable');}finally{loadingScan=false;render();}}
async function evaluateLead(id){toast('YorpMind reviewing…');try{const outcome=await callApi('/api/ai/evaluate','POST',{id});if(outcome.skipped)toast('Already reviewed');else toast('AI review saved');await reload();if(!detailId)openDetail(id);else openDetail(id);}catch(e){toast(e.message||'AI unavailable');}}
function exportData(){const a=document.createElement('a');a.href='/api/export';a.download='YorpHivesHQ-backup.json';document.body.appendChild(a);a.click();a.remove();toast('Export requested');}
async function toggleSaved(id){const exists=savedIds().has(id);try{await callApi('/api/saved','POST',{id,saved:!exists});if(exists)data.saved=data.saved.filter(x=>x!==id);else data.saved.push(id);toast(exists?'Removed':'Saved');if(detailId)closeDetail();render();}catch(e){toast(e.message||'Not saved');}}
async function decide(id,action){try{await callApi('/api/decision','POST',{id,action});data.decisions=data.decisions.filter(x=>x.opportunity_id!==id);data.decisions.push({opportunity_id:id,action,updated_at:new Date().toISOString()});toast(`${action[0].toUpperCase()+action.slice(1)} recorded`);render();}catch(e){toast(e.message||'Not recorded');}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}const cat=e.target.closest('[data-cat]');if(cat){category=cat.dataset.cat;render();return;}const save=e.target.closest('[data-save]');if(save){toggleSaved(save.dataset.save);return;}const detail=e.target.closest('[data-detail]');if(detail){openDetail(detail.dataset.detail);return;}const decision=e.target.closest('[data-decision]');if(decision){decide(decision.dataset.id,decision.dataset.decision);return;}if(e.target.closest('#saved-filter')){savedOnly=!savedOnly;render();return;}if(e.target.closest('#run-scan')){scan();return;}const ai=e.target.closest('[data-evaluate]');if(ai){evaluateLead(ai.dataset.evaluate);return;}if(e.target.closest('#export-data')){exportData();return;}if(e.target.closest('#close-drawer')||e.target.id==='overlay'){closeDetail();return;}if(e.target.closest('#more-btn')){moreOpen=!moreOpen;renderNav();return;}if(e.target.closest('#about-btn')){toast('Founder-only HQ · Cloudflare Free');return;}});
document.addEventListener('input',e=>{if(e.target.id==='idea-search'){search=e.target.value;const list=document.getElementById('idea-results');if(list)list.innerHTML=results();}});
document.addEventListener('change',e=>{if(e.target.id==='idea-sort'){sort=e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(detailId)closeDetail();moreOpen=false;document.getElementById('mobile-more').classList.remove('show');}if(e.key==='Tab'&&detailId){const focusable=[...document.getElementById('drawer').querySelectorAll('button,a[href]')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
addEventListener('hashchange',()=>{moreOpen=false;if(detailId)closeDetail();render();scrollTo(0,0);});
document.querySelectorAll('[data-icon]').forEach(x=>{x.innerHTML=I(x.dataset.icon)});
render();reload();

</script></body></html>
