name: YorpHivesHQ Native verification
on:
  pull_request:
    paths:
      - 'fresh-native/**'
      - '.github/workflows/yorphiveshq-native.yml'
  push:
    branches:
      - 'feature/yhq-native-*'
    paths:
      - 'fresh-native/**'
      - '.github/workflows/yorphiveshq-native.yml'
permissions:
  contents: read
jobs:
  security-and-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate security, AI quota, monitoring and D1 workflow
        run: node --test fresh-native/tests/*.test.mjs
      - name: Compile deployable Worker with SHA-256 CSP
        run: |
          node fresh-native/build.mjs
          node --check fresh-native/dist/worker.mjs
          node --check fresh-native/watchdog.mjs
          node --check fresh-native/app.js
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium firefox webkit
      - name: Check mobile, tablet, desktop, navigation and AI interactions
        env:
          YHQ_REQUIRE_3_BROWSERS: '1'
        run: |
          python fresh-native/tests/ui_test.py
          python fresh-native/tests/csp_test.py