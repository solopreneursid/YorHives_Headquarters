name: Cloudflare Free Headquarters verification
on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'dashboard.js'
      - 'index.html'
      - 'styles.css'
      - 'assets/**'
      - '.github/workflows/cloudflare-free-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  free-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout unprivileged snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm anonymous pilot visits reach Cloudflare Access sign-in
        shell: bash
        run: |
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          status="$(curl --silent --show-error --max-time 18 --retry 2 \
            --user-agent 'YorpHives-HQ-Access-Test/1.0' \
            --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
            'https://yorphives-hq-free-pilot.solopreneursid-proy.workers.dev/')"
          echo "Anonymous access returned HTTP $status (expected redirect to Access)."
          test "$status" = 302 || test "$status" = 303
          grep -qiE '^location:.*(/cdn-cgi/access/|cloudflareaccess\\.com)' "$headers"
          echo 'PASS: private pilot requires Access login without exposing the dashboard.'
      - name: Check Cloudflare worker JavaScript
        run: |
          node --check cloudflare/src/worker.mjs
          node --test cloudflare/tests/*.test.mjs
      - name: Build vetted public assets only
        run: |
          node cloudflare/build-assets.mjs
          node cloudflare/build-standalone.mjs
          node --check cloudflare/.generated/standalone-worker.mjs
          python3 - <<'PY'
          from pathlib import Path
          root=Path('cloudflare/dist')
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          required={'index.html','styles.css','dashboard.js','assets/yorphives-logo.webp','assets/yorphives-mark.webp'}
          assert actual == required,(actual, required)
          for name in ('yorphives-logo.webp','yorphives-mark.webp'):
              p=root/'assets'/name
              assert p.read_bytes()[:4]==b'RIFF' and p.read_bytes()[8:12]==b'WEBP'
          print('PASS: only three UI files and two approved official brand assets')
          PY
      - name: Validate SQLite-compatible schema
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          conn=sqlite3.connect(':memory:')
          for migration in sorted(Path('cloudflare/migrations').glob('*.sql')):
              conn.executescript(migration.read_text())
          tables={r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'assets','findings','opportunities','quota','status','security_watch'} <= tables
          print('PASS: six required evidence tables created without external dependencies')
          PY
      - name: Run existing frontend contracts
        run: |
          node --check dashboard.js
          node --test tests/quality.test.mjs
          node scripts/qa-check.mjs
