name: HQ current four-button browser regression
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'hq-release.json'
      - 'scripts/verify-current-hq.mjs'
      - 'scripts/test-four-button-browser.mjs'
      - '.github/workflows/hq-browser-integration.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'hq-release.json'
      - 'scripts/verify-current-hq.mjs'
      - 'scripts/test-four-button-browser.mjs'
      - '.github/workflows/hq-browser-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test-only browser dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-fund --no-audit playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test current HQ desktop and mobile, read-only mocked APIs
        run: |
          node scripts/verify-current-hq.mjs
          node scripts/test-four-button-browser.mjs
      - name: State coverage boundary
        if: always()
        run: echo 'Synthetic four-button UI only; not a real founder-authenticated browser, no production writes.' >> "$GITHUB_STEP_SUMMARY"
