name: HQ browser integration
on:
  push:
    paths:
      - 'src/**'
      - 'scripts/test-browser.mjs'
      - '.github/workflows/hq-browser-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install open-source test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test HQ desktop and mobile frontend using synthetic report
        run: node scripts/test-browser.mjs
      - name: Record verification scope
        if: always()
        run: |
          {
            echo '## HQ browser test'
            echo 'Local isolated HTTP server serves the embedded HQ frontend.'
            echo 'Synthetic API report: 2 incidents, 1 finding, 1 opportunity.'
            echo 'Chromium desktop/mobile navigation, back behavior, filtering,'
            echo 'incident details, overflow and browser exceptions.'
            echo 'No production credentials, D1 writes, founder login or website changes.'
          } >> "$GITHUB_STEP_SUMMARY"
