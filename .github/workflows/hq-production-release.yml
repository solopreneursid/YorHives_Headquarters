name: HQ production release (manual, founder approved)
on:
  workflow_dispatch:
    inputs:
      founder_confirmation:
        description: "Confirm the protected HQ source publication; founder environment approval is still required"
        required: true
        default: "RELEASE_FOUR_BUTTON_HQ"
        type: string
permissions:
  contents: read
concurrency:
  group: hq-production-release
  cancel-in-progress: false
jobs:
  deploy-private-hq:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: hq-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify approved private source (does not deploy)
        run: |
          node --check scripts/release-hq-manual.mjs
          node scripts/verify-current-hq.mjs
      - name: Set expected live version from the reviewed release manifest
        shell: bash
        run: |
          node -e "const m=require('./hq-release.json'); console.log('EXPECTED_CURRENT_VERSION='+m.sourceWorkerVersion)" >> "$GITHUB_ENV"
      - name: Verify Products trends before release (offline)
        run: node scripts/test-products-trends.mjs
      - name: Deploy ONLY with founder-approved environment and scoped Worker token
        env:
          HQ_RELEASE_TOKEN: ${{ secrets.HQ_RELEASE_TOKEN }}
          HQ_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HQ_CLOUDFLARE_ACCOUNT_ID }}
          HQ_APPROVED_SOURCE_SHA: ${{ github.sha }}
          HQ_FOUNDER_CONFIRMATION: ${{ inputs.founder_confirmation }}
        run: node scripts/release-hq-manual.mjs
      - name: Scope notice
        if: always()
        run: echo 'Source/bindings checked. Cloudflare Access login and external uptime must be verified separately.' >> "$GITHUB_STEP_SUMMARY"
