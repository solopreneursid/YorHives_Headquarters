name: HQ current four-button source integrity
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'hq-release.json'
      - 'scripts/verify-current-hq.mjs'
      - '.github/workflows/hq-source-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current-hq:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source blobs, access guard, 4-button UI, and read-only policy
        run: |
          node --check src/hq-worker.mjs
          node --check src/growth-evidence.mjs
          node --check src/watchdog-evidence.mjs
          node --check src/agent-demand-evidence.mjs
          node scripts/verify-current-hq.mjs
      - name: Confirm no automatic deployment
        run: echo 'This CI is observation/testing only. It has no production token or deployment step.'
