name: HQ source integrity
on:
  push:
    paths:
      - 'src/**'
      - 'scripts/verify-hq.mjs'
      - 'scripts/test-incidents.mjs'
      - 'scripts/test-auth.mjs'
      - 'scripts/test-private-ai.mjs'
      - 'scripts/test-workers-ai.mjs'
      - 'scripts/test-nano-workflows.mjs'
      - 'scripts/test-nano-learning.mjs'
      - 'scripts/test-nano-triage.mjs'
      - 'scripts/test-nano-investigations.mjs'
      - 'scripts/test-nano-global-sources.mjs'
      - 'scripts/test-nano-source-quality.mjs'
      - 'scripts/test-nano-opportunity-briefs.mjs'
      - 'scripts/test-nano-journals.mjs'
      - 'scripts/test-nano-science-reviews.mjs'
      - 'scripts/test-nano-implementation.mjs'
      - 'scripts/test-nano-feasibility.mjs'
      - 'scripts/test-nano-manifests.mjs'
      - 'scripts/test-nano-dependencies.mjs'
      - 'scripts/test-nano-founder-reviews.mjs'
      - 'scripts/test-deep-links.mjs'
      - 'scripts/test-growth-evidence.mjs'
      - '.github/workflows/hq-source-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-hq:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check source and embedded dashboard
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node scripts/verify-hq.mjs
          node scripts/test-incidents.mjs
          node scripts/test-auth.mjs
          node scripts/test-private-ai.mjs
          node scripts/test-workers-ai.mjs
          node scripts/test-nano-workflows.mjs
          node scripts/test-nano-learning.mjs
          node scripts/test-nano-triage.mjs
          node scripts/test-nano-investigations.mjs
          node scripts/test-nano-global-sources.mjs
          node scripts/test-nano-source-quality.mjs
          node scripts/test-nano-opportunity-briefs.mjs
          node scripts/test-nano-journals.mjs
          node scripts/test-nano-science-reviews.mjs
          node scripts/test-nano-implementation.mjs
          node scripts/test-nano-feasibility.mjs
          node scripts/test-nano-manifests.mjs
          node scripts/test-nano-dependencies.mjs
          node scripts/test-nano-founder-reviews.mjs
          node scripts/test-deep-links.mjs
          node scripts/test-growth-evidence.mjs
      - name: Record verification scope
        if: always()
        shell: bash
        run: |
          {
            echo '## HQ source integrity'
            echo 'Checks: Worker syntax, embedded dashboard syntax, HQpulse UI,'
            echo 'incident ledger references, access and read-only guards.\n            echo 'Lifecycle: detect, repeat, resolve, reopen and historical import.''
            echo ''
            echo 'This job does not verify authenticated browser flows,'
            echo 'Cloudflare bindings, D1 data, or real incident recovery.'
          } >> "$GITHUB_STEP_SUMMARY"
